<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>希腊 10 日行程 · 雅典 · 梅黛奥拉 · 米洛斯 · 克里特</title>
<meta name="description" content="2026.10.01-10.10 希腊自由行完整行程：航班、轮渡、住宿、逐日安排，手机端查看。">
<meta property="og:type" content="website">
<meta property="og:title" content="希腊 10 日行程 · 雅典 · 梅黛奥拉 · 米洛斯 · 克里特">
<meta property="og:description" content="2026.10.01-10.10 希腊自由行完整行程：4 段航班、3 段夜船、逐日安排一页看完。">
<meta name="theme-color" content="#0EA5E9">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --primary:#0EA5E9; --primary-dark:#0284C7; --primary-deep:#0C4A6E;
  --secondary:#38BDF8; --accent:#F97316; --accent-soft:#FFF7ED;
  --bg:#F0F9FF; --surface:#FFFFFF; --surface-2:#F8FAFC;
  --text:#0F172A; --text-muted:#475569; --text-soft:#64748B;
  --border:#E2E8F0; --border-strong:#CBD5E1;
  --ok:#059669; --ok-bg:#ECFDF5; --warn:#B45309; --warn-bg:#FFFBEB;
  --pend:#64748B; --pend-bg:#F1F5F9; --night:#4338CA; --night-bg:#EEF2FF;
  --r:14px; --r-lg:20px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 12px rgba(15,23,42,.08);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + var(--safe-b));
  overflow-x:hidden;
}
.wrap{max-width:560px;margin:0 auto;position:relative}

/* ---------- HERO ---------- */
.hero{
  position:relative; overflow:hidden;
  background:linear-gradient(160deg,#0C4A6E 0%,#0369A1 45%,#0EA5E9 100%);
  color:#fff; padding:30px 20px 26px;
}
.hero::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 82% 12%,rgba(255,255,255,.22),transparent 42%),
    radial-gradient(circle at 12% 88%,rgba(56,189,248,.28),transparent 46%);
  pointer-events:none;
}
.hero-wave{position:absolute;bottom:-1px;left:0;width:100%;height:26px;display:block}
.hero-inner{position:relative;z-index:1}
.hero-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:600;letter-spacing:.09em;
  background:rgba(255,255,255,.18);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.25);
  padding:5px 11px;border-radius:999px;margin-bottom:13px;
}
.hero h1{font-size:25px;line-height:1.28;font-weight:750;letter-spacing:-.01em}
.hero h1 small{display:block;font-size:13.5px;font-weight:450;opacity:.9;margin-top:7px;letter-spacing:.02em}
.hero-date{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  margin-top:15px;font-size:14px;font-weight:550;
}
.hero-date .arw{opacity:.65}
.hero-stats{display:flex;gap:8px;margin-top:18px}
.hstat{
  flex:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(8px);border-radius:12px;padding:9px 6px;text-align:center;
}
.hstat b{display:block;font-size:19px;font-weight:700;line-height:1.2}
.hstat span{font-size:10.5px;opacity:.88;letter-spacing:.03em}

/* ---------- NAV ---------- */
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.93);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  display:flex;overflow-x:auto;scrollbar-width:none;
  padding:0 8px;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  flex:0 0 auto;background:none;border:none;font-family:inherit;
  font-size:13.5px;font-weight:600;color:var(--text-soft);
  padding:13px 13px 11px;cursor:pointer;position:relative;
  transition:color .2s;white-space:nowrap;
}
.nav button[aria-selected="true"]{color:var(--primary-dark)}
.nav button[aria-selected="true"]::after{
  content:"";position:absolute;left:12px;right:12px;bottom:0;height:2.5px;
  background:var(--primary);border-radius:3px 3px 0 0;
}
.nav button:focus-visible{outline:2px solid var(--primary);outline-offset:-3px;border-radius:6px}

/* ---------- SECTION / PANEL ---------- */
.panel{display:none;padding:18px 14px 8px;animation:fade .28s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:center;gap:8px;margin:4px 2px 12px}
.sec-h h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-h .cnt{
  font-size:11.5px;font-weight:650;color:var(--primary-dark);
  background:#E0F2FE;padding:2px 8px;border-radius:999px;
}
.sec-note{
  font-size:12.5px;color:var(--text-muted);background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px;
  padding:9px 11px;margin:0 2px 14px;line-height:1.6;
}

/* ---------- CARD ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:var(--shadow);
  margin-bottom:11px;overflow:hidden;
}
.card-pad{padding:13px 14px}

/* ---------- BADGE ---------- */
.bd{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:650;letter-spacing:.02em;
  padding:2.5px 8px;border-radius:999px;white-space:nowrap;
}
.bd-ok{background:var(--ok-bg);color:var(--ok)}
.bd-warn{background:var(--warn-bg);color:var(--warn)}
.bd-pend{background:var(--pend-bg);color:var(--pend)}
.bd-night{background:var(--night-bg);color:var(--night)}
.bd-hot{background:#FEF2F2;color:#DC2626}
.bd-dot::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}

/* ---------- DAY TIMELINE ---------- */
.day{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:var(--shadow);
  margin-bottom:11px;overflow:hidden;
}
.day-hd{
  display:flex;align-items:stretch;gap:0;width:100%;
  background:none;border:none;font-family:inherit;text-align:left;
  cursor:pointer;padding:0;
}
.day-num{
  flex:0 0 58px;background:linear-gradient(165deg,#F0F9FF,#E0F2FE);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px 4px;
}
.day-num b{font-size:18px;font-weight:750;color:var(--primary-deep);line-height:1.1}
.day-num span{font-size:10px;color:var(--primary-dark);font-weight:600;margin-top:2px}
.day-meta{flex:1;min-width:0;padding:11px 12px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.day-meta .dt{font-size:11.5px;color:var(--text-soft);font-weight:600;letter-spacing:.02em}
.day-meta .tt{font-size:14.5px;font-weight:650;line-height:1.4;color:var(--text)}
.day-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:1px}
.day-chev{
  flex:0 0 36px;display:flex;align-items:center;justify-content:center;color:var(--text-soft);
  transition:transform .25s;
}
.day[open] .day-chev{transform:rotate(180deg)}
.day-bd{border-top:1px solid var(--border);padding:14px 14px 4px;background:var(--surface-2)}

.tl{position:relative;padding-left:22px}
.tl::before{
  content:"";position:absolute;left:5px;top:6px;bottom:14px;width:2px;
  background:linear-gradient(180deg,var(--secondary),#BAE6FD);border-radius:2px;
}
.tl-i{position:relative;margin-bottom:14px}
.tl-i::before{
  content:"";position:absolute;left:-21px;top:5px;
  width:10px;height:10px;border-radius:50%;
  background:var(--surface);border:2.5px solid var(--primary);
  box-shadow:0 0 0 3px var(--surface-2);
}
.tl-i.k-flight::before{border-color:#7C3AED}
.tl-i.k-ferry::before,.tl-i.k-ferry-arrival::before{border-color:#0891B2}
.tl-i.k-tour::before{border-color:var(--accent)}
.tl-i.k-transfer::before{border-color:#059669}
.tl-i.k-undecided::before{border-color:#94A3B8;border-style:dashed}
.tl-t{font-size:11.5px;font-weight:700;color:var(--primary-dark);letter-spacing:.03em;margin-bottom:2px}
.tl-ti{font-size:14px;font-weight:600;line-height:1.5}
.tl-d{font-size:12.5px;color:var(--text-muted);line-height:1.62;margin-top:4px}
.tl-key{
  border-left:3px solid var(--accent);background:var(--accent-soft);
  margin-left:-10px;padding:7px 10px;border-radius:0 8px 8px 0;
}
.wish{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.wish span{font-size:11.5px;background:#E0F2FE;color:var(--primary-deep);padding:3px 8px;border-radius:7px;font-weight:550}
.notes{margin-top:2px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:12px}
.notes .nh{font-size:11px;font-weight:700;color:var(--text-soft);letter-spacing:.06em;margin-bottom:5px}
.notes li{font-size:12.5px;color:var(--text-muted);line-height:1.65;margin-left:15px;margin-bottom:3px}
.stay{
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
  padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;
}
.stay .ic{flex:0 0 auto;color:var(--primary-dark)}
.stay .tx{flex:1;min-width:0}
.stay .tx b{display:block;font-size:13px;font-weight:650}
.stay .tx span{font-size:11.5px;color:var(--text-soft)}

/* ---------- FLIGHT ---------- */
.fl-hd{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 14px;background:linear-gradient(100deg,#F5F3FF,#FAF5FF);
  border-bottom:1px solid var(--border);
}
.fl-no{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:#5B21B6}
.fl-body{display:flex;align-items:center;gap:10px;padding:14px}
.fl-pt{flex:1;min-width:0;text-align:center}
.fl-pt b{display:block;font-size:21px;font-weight:750;letter-spacing:-.02em;line-height:1.2}
.fl-pt span{display:block;font-size:11.5px;color:var(--text-muted);margin-top:3px;line-height:1.4}
.fl-mid{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-soft)}
.fl-mid .ln{width:100%;height:1.5px;background:repeating-linear-gradient(90deg,var(--border-strong) 0 4px,transparent 4px 8px);position:relative}
.fl-mid .ln svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface);padding:0 3px}
.fl-mid span{font-size:10.5px;font-weight:600}
.fl-ft{padding:8px 14px;background:var(--surface-2);border-top:1px solid var(--border);font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lay{
  margin:-4px 0 11px;padding:11px 13px;
  background:var(--warn-bg);border:1px dashed #FCD34D;border-radius:var(--r);
}
.lay b{font-size:13px;font-weight:650;color:#92400E;display:flex;align-items:center;gap:6px}
.lay p{font-size:12.5px;color:#A16207;line-height:1.6;margin-top:4px}

/* ---------- FERRY ---------- */
.fy-hd{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 14px;background:linear-gradient(100deg,#ECFEFF,#F0F9FF);border-bottom:1px solid var(--border);
}
.fy-v{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#155E75}
.fy-v small{font-weight:550;color:var(--text-soft);font-size:11px}

/* ---------- HOTEL ---------- */
.ht-hd{display:flex;align-items:flex-start;gap:10px;padding:13px 14px 11px}
.ht-ic{
  flex:0 0 38px;height:38px;border-radius:11px;
  background:linear-gradient(150deg,#E0F2FE,#BAE6FD);
  display:flex;align-items:center;justify-content:center;color:var(--primary-deep);
}
.ht-ic.ph{background:var(--pend-bg);color:var(--pend)}
.ht-tx{flex:1;min-width:0}
.ht-tx b{font-size:15px;font-weight:700;display:block;line-height:1.35}
.ht-tx b.ph{color:var(--text-soft);font-weight:600}
.ht-tx .loc{font-size:12px;color:var(--text-muted);margin-top:2px;display:flex;align-items:center;gap:4px}
.ht-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--border)}
.ht-g{padding:9px 6px;text-align:center;border-right:1px solid var(--border)}
.ht-g:last-child{border-right:none}
.ht-g span{display:block;font-size:10px;color:var(--text-soft);letter-spacing:.04em;font-weight:600}
.ht-g b{display:block;font-size:12.5px;font-weight:650;margin-top:2px}

/* ---------- TRANSPORT OPTIONS ---------- */
.opt{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow);
}
.opt.best{border-color:var(--accent);border-width:1.5px;box-shadow:0 2px 10px rgba(249,115,22,.13)}
.opt-hd{display:flex;align-items:center;gap:9px;padding:11px 13px}
.opt-rk{
  flex:0 0 26px;height:26px;border-radius:8px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:750;color:var(--text-soft);
}
.opt.best .opt-rk{background:var(--accent);color:#fff}
.opt-nm{flex:1;min-width:0;font-size:14px;font-weight:680;line-height:1.35}
.opt-pr{font-size:14px;font-weight:750;color:var(--primary-dark);white-space:nowrap}
.opt-bd{padding:0 13px 12px;font-size:12.5px;color:var(--text-muted);line-height:1.65}
.opt-row{display:flex;gap:7px;margin-top:6px}
.opt-row .k{flex:0 0 46px;color:var(--text-soft);font-weight:600;font-size:12px}
.opt-row .v{flex:1;min-width:0}
.pc{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.pc span{font-size:11px;padding:2.5px 7px;border-radius:6px;font-weight:550}
.pc .p{background:var(--ok-bg);color:var(--ok)}
.pc .c{background:#FEF2F2;color:#B91C1C}

.plan{background:linear-gradient(165deg,#FFF7ED,#FFFBEB);border:1px solid #FDBA74;border-radius:var(--r);padding:14px;margin-bottom:12px}
.plan-h{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:#9A3412;margin-bottom:11px}
.plan-tl{position:relative;padding-left:19px}
.plan-tl::before{content:"";position:absolute;left:4px;top:5px;bottom:8px;width:2px;background:#FDBA74;border-radius:2px}
.plan-i{position:relative;margin-bottom:10px}
.plan-i::before{content:"";position:absolute;left:-18px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2.5px #FFF7ED}
.plan-i b{font-size:12px;font-weight:750;color:#9A3412;letter-spacing:.02em}
.plan-i p{font-size:12.5px;color:#7C2D12;line-height:1.6;margin-top:1px}
.plan-bf{margin-top:9px;padding-top:9px;border-top:1px dashed #FDBA74;font-size:12px;color:#9A3412;font-weight:600}

/* ---------- CHECKLIST ---------- */
.ck{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.ck-h{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700}
.ck-i{display:flex;align-items:flex-start;gap:9px;padding:10px 14px;border-bottom:1px solid var(--surface-2)}
.ck-i:last-child{border-bottom:none}
.ck-i .bx{flex:0 0 auto;margin-top:2px}
.ck-i .tx{flex:1;min-width:0}
.ck-i .tx b{display:block;font-size:13.5px;font-weight:600;line-height:1.45}
.ck-i .tx span{display:block;font-size:11.5px;color:var(--text-soft);margin-top:2px;line-height:1.55}
.ck-i .dt{font-size:11px;font-weight:650;color:var(--primary-dark);background:#E0F2FE;padding:2px 7px;border-radius:6px;white-space:nowrap;flex:0 0 auto}

.dl{background:#FEF2F2;border:1px solid #FECACA;border-radius:var(--r);padding:13px 14px;margin-bottom:12px}
.dl-h{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:#B91C1C;margin-bottom:9px}
.dl-i{display:flex;gap:9px;padding:6px 0;border-top:1px dashed #FECACA}
.dl-i:first-of-type{border-top:none}
.dl-i b{flex:0 0 52px;font-size:12px;font-weight:750;color:#DC2626}
.dl-i p{flex:1;font-size:12.5px;color:#7F1D1D;line-height:1.55}

.lk{display:flex;align-items:center;gap:9px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:9px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:border-color .2s,background .2s}
.lk:active{background:var(--surface-2);border-color:var(--primary)}
.lk .ic{flex:0 0 34px;height:34px;border-radius:10px;background:#E0F2FE;display:flex;align-items:center;justify-content:center;color:var(--primary-dark)}
.lk .tx{flex:1;min-width:0}
.lk .tx b{display:block;font-size:13.5px;font-weight:650;line-height:1.4}
.lk .tx span{display:block;font-size:11.5px;color:var(--text-soft);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.map{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;color:var(--primary-dark);text-decoration:none;margin-top:6px;padding:4px 9px;background:#E0F2FE;border-radius:7px}

/* ---------- 地点 / 地图跳转 ---------- */
.gp{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:600;line-height:1.35;
  color:var(--primary-dark);text-decoration:none;
  background:#E0F2FE;border:1px solid #BAE6FD;
  padding:3px 8px;border-radius:8px;cursor:pointer;
  transition:background .2s,border-color .2s;max-width:100%;
}
.gp:active{background:#BAE6FD;border-color:var(--primary)}
.gp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gp-s{background:var(--accent-soft);border-color:#FDBA74;color:#9A3412}
.gp-s:active{background:#FED7AA}
.gp-off{background:var(--pend-bg);border:1px dashed var(--border-strong);color:var(--text-soft);cursor:default}
.gps{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}

.pr{
  display:flex;align-items:flex-start;gap:9px;
  padding:10px 12px;background:var(--surface);
  border:1px solid var(--border);border-radius:11px;
  margin-bottom:7px;text-decoration:none;color:inherit;cursor:pointer;
  transition:border-color .2s,background .2s;
}
.pr:active{background:#F0F9FF;border-color:var(--primary)}
.pr-off{cursor:default;background:var(--surface-2);border-style:dashed}
.pr-ic{
  flex:0 0 32px;height:32px;border-radius:9px;
  background:linear-gradient(150deg,#E0F2FE,#BAE6FD);
  display:flex;align-items:center;justify-content:center;color:var(--primary-deep);
}
.pr-ic.ph{background:var(--pend-bg);color:var(--pend)}
.pr-tx{flex:1;min-width:0}
.pr-tx b{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;font-weight:650;line-height:1.4}
.pr-tx b>.bd{flex:0 0 auto}
.pr-tx span{display:block;font-size:11.5px;color:var(--text-muted);margin-top:1px;line-height:1.5}
.pr-tx em{display:block;font-size:11.5px;color:var(--text-soft);margin-top:3px;line-height:1.55;font-style:normal}
.pr-go{
  flex:0 0 30px;height:30px;border-radius:9px;background:#E0F2FE;
  display:flex;align-items:center;justify-content:center;color:var(--primary-dark);
  align-self:center;
}

/* ---------- 物流时间轴（住宿+交通合并） ---------- */
.lg-day{
  display:flex;align-items:center;gap:8px;
  margin:16px 2px 9px;
}
.lg-day:first-of-type{margin-top:4px}
.lg-day b{font-size:14px;font-weight:750;color:var(--primary-deep)}
.lg-day span{font-size:11.5px;color:var(--text-soft);font-weight:600}
.lg-day::after{content:"";flex:1;height:1px;background:var(--border)}
.lg{
  position:relative;padding-left:26px;margin-bottom:9px;
}
.lg::before{
  content:"";position:absolute;left:9px;top:30px;bottom:-13px;width:2px;
  background:var(--border);
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild}
function md(s){var m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);return m?m[2]+'.'+m[3]:s}
function gmap(q){return 'https://maps.google.com/?q='+encodeURIComponent(q)}

/* ---------- 地点索引 & 地图链接 ---------- */
var PLACES={};
(D.places||[]).forEach(function(p){PLACES[p.id]=p});
var isIOS=/iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent||'');
function P(id){return PLACES[id]||null}
/* 优先 Apple Maps(iOS) / Google Maps，均可在微信内唤起或落地网页 */
function mapUrl(pl){
  if(!pl) return null;
  var L=pl.mapLinks||{};
  if(isIOS&&L.apple) return L.apple;
  return L.google||L.apple||L.amap||null;
}
/* 地点药丸：可点击跳地图 */
function pill(id,opt){
  var pl=P(id); if(!pl) return '';
  opt=opt||{};
  var u=mapUrl(pl);
  var nm=esc(opt.label||pl.name);
  if(!u) return '<span class="gp gp-off">'+I.pin+nm+'</span>';
  return '<a class="gp'+(opt.strong?' gp-s':'')+'" href="'+esc(u)+'" target="_blank" rel="noopener">'+
         I.pin+'<span>'+nm+'</span>'+I.ext+'</a>';
}
/* 地点详情行（名称 + 地址 + 备注 + 跳转） */
function placeRow(id,opt){
  var pl=P(id); if(!pl) return '';
  opt=opt||{};
  var u=mapUrl(pl);
  var sub=[];
  if(pl.address) sub.push(esc(pl.address));
  else if(pl.city&&!opt.hideCity) sub.push(esc(pl.city));
  var inner='<div class="pr-ic'+(pl.isPlaceholder?' ph':'')+'">'+(I[pl.type]||I.pin)+'</div>'+
    '<div class="pr-tx"><b>'+esc(opt.label||pl.name)+'</b>'+
    (sub.length?'<span>'+sub.join(' · ')+'</span>':'')+
    (opt.note!==false&&pl.note?'<em>'+esc(pl.note)+'</em>':'')+
    '</div>'+
    (u?'<span class="pr-go">'+I.nav+'</span>':'<span class="bd bd-pend" style="flex:0 0 auto">待定</span>');
  return u?'<a class="pr" href="'+esc(u)+'" target="_blank" rel="noopener">'+inner+'</a>'
          :'<div class="pr pr-off">'+inner+'</div>';
}

         '<div class="dl-i" style="border:none"><b style="color:#B45309">女士</b><p style="color:#92400E">'+esc(t1.dressCode.women)+'</p></div>'+
         '<div class="dl-i" style="border-color:#FCD34D"><b style="color:#B45309">男士</b><p style="color:#92400E">'+esc(t1.dressCode.men)+'</p></div>'+

})();

/* ---------- share ---------- */
var toast=document.getElementById('toast');
function tip(m){toast.textContent=m;toast.classList.add('on');setTimeout(function(){toast.classList.remove('on')},2400)}
document.getElementById('shareBtn').onclick=function(){
  var u=location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(function(){tip('链接已复制，去微信粘贴发送吧')},function(){fb(u)});
  } else fb(u);
  function fb(x){
    var i=document.createElement('textarea');i.value=x;i.style.position='fixed';i.style.opacity='0';
    document.body.appendChild(i);i.select();
    try{document.execCommand('copy');tip('链接已复制，去微信粘贴发送吧')}catch(e){tip('请长按地址栏复制链接')}
    document.body.removeChild(i);
  }
};
})();
